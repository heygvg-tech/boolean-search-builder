[project]
name = "boolean-search-builder"
version = "0.1.0"
description = "Build Boolean sourcing strings for LinkedIn Recruiter, Google X-ray and GitHub X-ray."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Genevieve Garcia" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
boolean = "boolean_builder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["boolean_builder"]
